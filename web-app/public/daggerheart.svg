<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bladeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <linearGradient id="handleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b1a1a"/>
      <stop offset="50%" style="stop-color:#a82828"/>
      <stop offset="100%" style="stop-color:#8b1a1a"/>
    </linearGradient>
  </defs>

  <!-- Heart shape -->
  <path d="M50 85 L20 55 Q5 40 20 25 Q35 10 50 25 Q65 10 80 25 Q95 40 80 55 Z"
        fill="#8b1a1a" stroke="#d4af37" stroke-width="2"/>

  <!-- Dagger blade -->
  <path d="M50 20 L45 50 L50 75 L55 50 Z"
        fill="url(#bladeGradient)" stroke="#666" stroke-width="0.5"/>

  <!-- Dagger crossguard -->
  <rect x="40" y="48" width="20" height="4" rx="1"
        fill="url(#handleGradient)" stroke="#d4af37" stroke-width="0.5"/>

  <!-- Dagger handle -->
  <rect x="47" y="52" width="6" height="12" rx="1"
        fill="url(#handleGradient)" stroke="#d4af37" stroke-width="0.5"/>

  <!-- Pommel -->
  <circle cx="50" cy="67" r="4"
          fill="#d4af37" stroke="#8b1a1a" stroke-width="1"/>
</svg>
